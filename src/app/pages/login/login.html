<section class="login">
  <div class="login__panel ticket-borde">
    <div class="login__encabezado">
      <span class="login__logo">
        <span class="login__logo-texto">Pedidos</span>
        <span class="login__logo-acento">360</span>
      </span>
      <h1 class="login__titulo">Inicia sesión</h1>
    </div>

    <div class="login__campo">
      <label class="login__etiqueta" for="correo">Correo electrónico</label>
      <input
        #correoInput
        id="correo"
        type="email"
        class="login__input"
        placeholder="nombre@correo.cl"
        [value]="correo()"
        (input)="onCorreoChange(correoInput.value)"
      />
    </div>

    <div class="login__campo">
      <label class="login__etiqueta" for="clave">Contraseña</label>
      <input
        #claveInput
        id="clave"
        type="password"
        class="login__input"
        placeholder="••••••••"
        [value]="clave()"
        (input)="onClaveChange(claveInput.value)"
      />
    </div>

    <button
      type="button"
      class="boton boton--primario login__boton"
      [disabled]="cargando()"
      (click)="enviar()"
    >
      {{ cargando() ? 'Ingresando...' : 'Iniciar sesión' }}
    </button>

    <div class="login__separador">
      <span>o</span>
    </div>

    <button
      type="button"
      class="boton boton--secundario login__boton login__boton-microsoft"
      (click)="loginConMicrosoft()"
    >
      <svg class="login__icono-ms" viewBox="0 0 21 21" width="18" height="18" aria-hidden="true">
        <rect x="1" y="1" width="9" height="9" fill="#f25022"/>
        <rect x="11" y="1" width="9" height="9" fill="#7fba00"/>
        <rect x="1" y="11" width="9" height="9" fill="#00a4ef"/>
        <rect x="11" y="11" width="9" height="9" fill="#ffb900"/>
      </svg>
      Iniciar sesión con Microsoft
    </button>
  </div>
</section>
