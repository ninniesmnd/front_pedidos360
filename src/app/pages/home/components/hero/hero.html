<section class="hero">
  <img
    class="hero__imagen"
    src="images/hero-productos.jpg"
    alt="Selección de productos horneados de la red Pedidos 360"
  />

  <div class="hero__superposicion"></div>

  <div class="hero__contenido contenedor">
    <p class="hero__etiqueta">Red de panaderías y cafeterías</p>
    <h1 class="hero__titulo">Todos tus pedidos, en un solo lugar</h1>
    <p class="hero__descripcion">
      Pedidos 360 conecta a tu panadería o cafetería con un sistema simple
      para tomar, seguir y controlar cada pedido de principio a fin.
    </p>
    <div class="hero__acciones">
      @if (estaAutenticado()) {
        <a routerLink="/dashboard" class="boton boton--primario">Ir a mi panel</a>
      } @else {
        <a routerLink="/login" class="boton boton--primario">Iniciar sesión</a>
      }
      <a href="#sobre-nosotros" class="boton boton--secundario hero__accion-clara">Conócenos</a>
    </div>
  </div>
</section>
